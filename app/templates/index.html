<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Injury Database</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #f5f6f8;
        }

        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: #111;
        }

        /* ---- Form ---- */
        #filter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
            margin-bottom: 1.5rem;
            background: #fff;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        #filter-form label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #555;
        }

        #filter-form select,
        #filter-form input[type="text"] {
            padding: 0.45rem 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.875rem;
            min-width: 160px;
            background: #fff;
        }

        #filter-form select:focus,
        #filter-form input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,.25);
        }

        #filter-form button {
            padding: 0.5rem 1.1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s;
        }

        button[type="submit"] {
            background: #2563eb;
            color: #fff;
        }
        button[type="submit"]:hover { background: #1d4ed8; }

        #download-csv {
            background: #e5e7eb;
            color: #374151;
        }
        #download-csv:hover { background: #d1d5db; }

        /* ---- Table ---- */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #f8f9fb;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #475569;
            padding: 0.75rem 0.75rem;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        tbody td {
            padding: 0.6rem 0.75rem;
            font-size: 0.85rem;
            border-bottom: 1px solid #f1f3f5;
            color: #334155;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) { background: #fafbfc; }
        tbody tr:hover { background: #eef2ff; }

        tbody td a {
            color: #2563eb;
            text-decoration: none;
        }
        tbody td a:hover { text-decoration: underline; }

        /* ---- Status multiselect ---- */
        .multiselect-label { flex-direction: column; }

        .multiselect {
            position: relative;
        }

        .multiselect-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-width: 160px;
            padding: 0.45rem 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.875rem;
            background: #fff;
            color: #1a1a1a;
            cursor: pointer;
            text-align: left;
        }

        .multiselect-trigger::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #666;
            margin-left: 0.5rem;
            flex-shrink: 0;
        }

        .multiselect-panel {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 2px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
            z-index: 100;
            padding: 0.35rem 0;
        }

        .multiselect-panel.open {
            display: block;
        }

        .multiselect-option {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            font-weight: 400 !important;
            font-size: 0.8rem !important;
            color: #333 !important;
            cursor: pointer;
            white-space: nowrap;
        }

        .multiselect-option:hover {
            background: #f0f4ff;
        }

        .multiselect-option input[type="checkbox"] {
            accent-color: #2563eb;
        }

        @media (max-width: 640px) {
            .page { padding: 1rem 0.5rem; }
            h1 { font-size: 1.25rem; }
            #filter-form { flex-direction: column; }
            #filter-form select,
            #filter-form input[type="text"] { min-width: 100%; }
        }

        .pagination {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 1rem;
            justify-content: center;
        }
        .pagination button {
            padding: 0.45rem 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background .15s;
        }
        .pagination button:hover:not(:disabled) { background: #e5e7eb; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .pagination span { font-size: 0.85rem; color: #555; }
    </style>
</head>
<body>
    <div class="page">
        <h1>NBA Injury Database</h1>
        <form id="filter-form">
            <label>Player: <select id="player-select" name="player_id"><option value="">All</option></select></label>
            <label>Team: <select id="team-select" name="team_id"><option value="">All</option></select></label>
            <label>Body Part: <input type="text" name="body_part"></label>
            <label>Season: <select name="season">
                <option value="">All Seasons</option>
                <option value="2018-19">2018-19</option>
                <option value="2019-20">2019-20</option>
                <option value="2020-21">2020-21</option>
                <option value="2021-22">2021-22</option>
                <option value="2022-23">2022-23</option>
                <option value="2023-24">2023-24</option>
                <option value="2024-25">2024-25</option>
                <option value="2025-26">2025-26</option>
            </select></label>
            <label>Start Date: <input type="text" name="start_date" placeholder="YYYY-MM-DD"></label>
            <label>End Date: <input type="text" name="end_date" placeholder="YYYY-MM-DD"></label>
            <label class="multiselect-label">Status:
                <div class="multiselect" id="status-multiselect">
                    <button type="button" class="multiselect-trigger" id="status-trigger" aria-haspopup="listbox" aria-expanded="false">4 statuses selected</button>
                    <div class="multiselect-panel" id="status-panel" role="listbox" aria-label="Status filter">
                        <label class="multiselect-option"><input type="checkbox" name="status" value="Out" checked> Out</label>
                        <label class="multiselect-option"><input type="checkbox" name="status" value="Doubtful" checked> Doubtful</label>
                        <label class="multiselect-option"><input type="checkbox" name="status" value="Questionable" checked> Questionable</label>
                        <label class="multiselect-option"><input type="checkbox" name="status" value="Probable" checked> Probable</label>
                        <label class="multiselect-option"><input type="checkbox" name="status" value="Available"> Available</label>
                    </div>
                </div>
            </label>
            <label>Injury Type: <input type="text" name="injury_type"></label>
            <label>Reason Search: <input type="text" name="reason_search"></label>
            <button type="submit">Filter</button>
            <button type="button" id="download-csv">Download CSV</button>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Player</th>
                        <th>Team</th>
                        <th>Game Date</th>
                        <th>Matchup</th>
                        <th>Status</th>
                        <th>Raw Reason</th>
                        <th>Reason Category</th>
                        <th>Body Part</th>
                        <th>Injury Type</th>
                    </tr>
                </thead>
                <tbody id="injuries-body"></tbody>
            </table>
        </div>
        <div class="pagination">
            <button type="button" id="prev-page" disabled>Previous</button>
            <span id="page-info">Page 1</span>
            <button type="button" id="next-page">Next</button>
        </div>
    </div>

    <script>
        let currentPage = 1;

        function loadDropdown(selectId, url, valueKey, labelKey) {
            return fetch(url)
                .then(res => res.json())
                .then(items => {
                    const select = document.getElementById(selectId);
                    items.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item[valueKey];
                        option.textContent = item[labelKey];
                        select.appendChild(option);
                    });
                });
        }

        Promise.all([
            loadDropdown('player-select', '/players', 'id', 'canonical_name'),
            loadDropdown('team-select', '/teams', 'id', 'canonical_name')
        ]).then(() => loadInjuries());

        function loadInjuries(filterQs) {
            const qs = filterQs ? filterQs + '&' : '';
            const url = '/injuries?' + qs + 'page=' + currentPage;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('injuries-body');
                    tbody.innerHTML = '';
                    data.forEach(entry => {
                        const tr = document.createElement('tr');
                        const values = [
                            entry.id, entry.player_name, entry.team_name, entry.game_date,
                            entry.matchup, entry.status, entry.raw_reason,
                            entry.reason_category, entry.body_part, entry.injury_type
                        ];
                        values.forEach((val, i) => {
                            const td = document.createElement('td');
                            if (i === 1 && entry.player_name && entry.player_id) {
                                const a = document.createElement('a');
                                a.href = '/players/' + entry.player_id;
                                a.textContent = entry.player_name;
                                td.appendChild(a);
                            } else {
                                td.textContent = val ?? '';
                            }
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                    updatePagination(data.length);
                });
        }

        function updatePagination(count) {
            document.getElementById('page-info').textContent = 'Page ' + currentPage;
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = count < 100;
        }

        function getFilterParams() {
            const fd = new FormData(document.getElementById('filter-form'));
            const params = [];
            const seen = {};
            for (const [k, v] of fd.entries()) {
                if (!v) continue;
                if (k === 'status') {
                    params.push('status=' + encodeURIComponent(v));
                } else {
                    params.push(k + '=' + encodeURIComponent(v));
                }
            }
            return params.join('&');
        }

        document.getElementById('filter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            currentPage = 1;
            loadInjuries(getFilterParams());
        });

        document.getElementById('prev-page').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                loadInjuries(getFilterParams());
            }
        });

        document.getElementById('next-page').addEventListener('click', function() {
            currentPage++;
            loadInjuries(getFilterParams());
        });

        document.getElementById('download-csv').addEventListener('click', function() {
            const qs = getFilterParams();
            window.location.href = '/injuries.csv' + (qs ? '?' + qs : '');
        });

        // ---- Status multiselect ----
        (function() {
            const trigger = document.getElementById('status-trigger');
            const panel = document.getElementById('status-panel');
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');

            function updateSummary() {
                const checked = panel.querySelectorAll('input[type="checkbox"]:checked');
                const total = checkboxes.length;
                if (checked.length === total) {
                    trigger.textContent = 'All statuses';
                } else if (checked.length === 0) {
                    trigger.textContent = 'None selected';
                } else if (checked.length <= 2) {
                    const names = Array.from(checked).map(cb => cb.value);
                    trigger.textContent = names.join(', ');
                } else {
                    trigger.textContent = checked.length + ' statuses selected';
                }
            }

            trigger.addEventListener('click', function() {
                const open = panel.classList.toggle('open');
                trigger.setAttribute('aria-expanded', open);
                if (open) {
                    const first = panel.querySelector('input[type="checkbox"]');
                    if (first) first.focus();
                }
            });

            checkboxes.forEach(function(cb) {
                cb.addEventListener('change', updateSummary);
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('status-multiselect').contains(e.target)) {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                }
            });

            trigger.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                } else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!panel.classList.contains('open')) {
                        panel.classList.add('open');
                        trigger.setAttribute('aria-expanded', 'true');
                        var first = panel.querySelector('input[type="checkbox"]');
                        if (first) first.focus();
                    }
                }
            });

            panel.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                    trigger.focus();
                }
            });

            updateSummary();
        })();
    </script>
</body>
</html>
