<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Injury Database</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #f5f6f8;
        }

        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: #111;
        }

        /* ---- Form ---- */
        #filter-form {
            margin-bottom: 1.5rem;
            background: #fff;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 0.75rem;
            align-items: stretch;
        }

        #filter-form label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #555;
        }

        #filter-form select,
        #filter-form input[type="text"] {
            height: 2rem;
            padding: 0 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.875rem;
            width: 100%;
            background: #fff;
        }

        #filter-form select:focus,
        #filter-form input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,.25);
        }

        .filter-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid #f1f3f5;
        }

        #filter-form button {
            height: 2rem;
            padding: 0 1.1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
        }

        button[type="submit"] {
            background: #2563eb;
            color: #fff;
        }
        button[type="submit"]:hover { background: #1d4ed8; }

        #download-csv,
        #clear-filters {
            background: #e5e7eb;
            color: #374151;
        }
        #download-csv:hover,
        #clear-filters:hover { background: #d1d5db; }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #64748b;
            font-size: 0.95rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            margin-top: 0.5rem;
        }

        /* ---- Table ---- */
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f8f9fb;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #475569;
            padding: 0.65rem 0.6rem;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        tbody td {
            padding: 0.5rem 0.6rem;
            font-size: 0.8rem;
            border-bottom: 1px solid #f1f3f5;
            color: #334155;
            white-space: nowrap;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        tbody td.col-raw-reason {
            max-width: 340px;
            min-width: 200px;
        }

        tbody td.col-player,
        tbody td.col-team,
        tbody td.col-matchup,
        tbody td.col-bodypart {
            max-width: 120px;
        }

        tbody td.col-status {
            max-width: 110px;
        }

        tbody tr:nth-child(even) { background: #fafbfc; }
        tbody tr:hover { background: #eef4ff; }

        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.4;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .status-badge.status-out { background: #fee2e2; color: #991b1b; }
        .status-badge.status-doubtful { background: #fef3c7; color: #92400e; }
        .status-badge.status-questionable { background: #fff7ed; color: #c2410c; }
        .status-badge.status-probable { background: #dbeafe; color: #1e40af; }
        .status-badge.status-available { background: #d1fae5; color: #065f46; }

        /* ---- Status multiselect ---- */
        .multiselect-label { flex-direction: column; }

        .multiselect {
            position: relative;
        }

        .multiselect-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 2rem;
            padding: 0 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.875rem;
            background: #fff;
            color: #1a1a1a;
            cursor: pointer;
            text-align: left;
        }

        .multiselect-trigger::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #666;
            margin-left: 0.5rem;
            flex-shrink: 0;
        }

        .multiselect-panel {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 2px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
            z-index: 100;
            padding: 0.35rem 0;
        }

        .multiselect-panel.open {
            display: block;
        }

        .multiselect-option {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            font-weight: 400 !important;
            font-size: 0.8rem !important;
            color: #333 !important;
            cursor: pointer;
            white-space: nowrap;
        }

        .multiselect-option:hover {
            background: #f0f4ff;
        }

        .multiselect-option input[type="checkbox"] {
            accent-color: #2563eb;
        }

        /* ---- Player autocomplete ---- */
        .autocomplete {
            position: relative;
        }

        .autocomplete-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 2px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.12);
            z-index: 100;
            max-height: 220px;
            overflow-y: auto;
        }

        .autocomplete-results.open {
            display: block;
        }

        .autocomplete-results:empty {
            display: none;
        }

        .autocomplete-result {
            padding: 0.4rem 0.6rem;
            font-size: 0.85rem;
            cursor: pointer;
            color: #333;
            white-space: nowrap;
        }

        .autocomplete-result:hover,
        .autocomplete-result.active {
            background: #f0f4ff;
        }

        @media (max-width: 640px) {
            .page { padding: 1rem 0.5rem; }
            h1 { font-size: 1.25rem; }
            .filter-grid { grid-template-columns: 1fr; }
            .filter-actions { justify-content: flex-start; }
            .table-wrap { margin: 0 -0.5rem; border-radius: 0; }
            tbody td { font-size: 0.75rem; padding: 0.4rem 0.5rem; }
            tbody td.col-raw-reason { min-width: 150px; }
        }

        .pagination {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            margin-top: 0.75rem;
            justify-content: center;
        }
        .pagination button {
            padding: 0.35rem 0.85rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background .15s;
        }
        .pagination button:hover:not(:disabled) { background: #e5e7eb; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .pagination span { font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>
    <div class="page">
        <h1>NBA Injury Database</h1>
        <form id="filter-form">
            <div class="filter-grid">
                <label>Player:
                    <div class="autocomplete" id="player-autocomplete">
                        <input type="text" id="player-input" placeholder="Search players..." autocomplete="off">
                        <input type="hidden" id="player_id" name="player_id" value="">
                        <div class="autocomplete-results" id="player-results"></div>
                    </div>
                </label>
                <label>Team: <select id="team-select" name="team_id"><option value="">All</option></select></label>
                <label>Body Part: <input type="text" name="body_part"></label>
                <label class="multiselect-label">Season:
                    <div class="multiselect" id="season-multiselect">
                        <button type="button" class="multiselect-trigger" id="season-trigger" aria-haspopup="listbox" aria-expanded="false">7 seasons</button>
                        <div class="multiselect-panel" id="season-panel" role="listbox" aria-label="Season filter">
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2018-19"> 2018-19</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2019-20" checked> 2019-20</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2020-21" checked> 2020-21</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2021-22" checked> 2021-22</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2022-23" checked> 2022-23</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2023-24" checked> 2023-24</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2024-25" checked> 2024-25</label>
                            <label class="multiselect-option"><input type="checkbox" name="season" value="2025-26" checked> 2025-26</label>
                        </div>
                    </div>
                </label>
                <label class="multiselect-label">Season Type:
                    <div class="multiselect" id="season-type-multiselect">
                        <button type="button" class="multiselect-trigger" id="season-type-trigger" aria-haspopup="listbox" aria-expanded="false">Regular + Play-In + Playoffs</button>
                        <div class="multiselect-panel" id="season-type-panel" role="listbox" aria-label="Season Type filter">
                            <label class="multiselect-option"><input type="checkbox" name="season_type" value="Preseason"> Preseason</label>
                            <label class="multiselect-option"><input type="checkbox" name="season_type" value="Regular Season" checked> Regular Season</label>
                            <label class="multiselect-option"><input type="checkbox" name="season_type" value="Play-In" checked> Play-In</label>
                            <label class="multiselect-option"><input type="checkbox" name="season_type" value="Playoffs" checked> Playoffs</label>
                        </div>
                    </div>
                </label>
                <label>Start Date: <input type="text" name="start_date" placeholder="YYYY-MM-DD"></label>
                <label>End Date: <input type="text" name="end_date" placeholder="YYYY-MM-DD"></label>
                <label class="multiselect-label">Status:
                    <div class="multiselect" id="status-multiselect">
                        <button type="button" class="multiselect-trigger" id="status-trigger" aria-haspopup="listbox" aria-expanded="false">All statuses</button>
                        <div class="multiselect-panel" id="status-panel" role="listbox" aria-label="Status filter">
                            <label class="multiselect-option"><input type="checkbox" name="status" value="Out" checked> Out</label>
                            <label class="multiselect-option"><input type="checkbox" name="status" value="Doubtful" checked> Doubtful</label>
                            <label class="multiselect-option"><input type="checkbox" name="status" value="Questionable" checked> Questionable</label>
                            <label class="multiselect-option"><input type="checkbox" name="status" value="Probable" checked> Probable</label>
                            <label class="multiselect-option"><input type="checkbox" name="status" value="Available" checked> Available</label>
                        </div>
                    </div>
                </label>
                <label>Injury Type: <input type="text" name="injury_type"></label>
                <label>Reason Search: <input type="text" name="reason_search"></label>
            </div>
            <div class="filter-actions">
                <button type="submit">Filter</button>
                <button type="button" id="clear-filters">Clear Filters</button>
                <button type="button" id="download-csv">Download filtered CSV</button>
            </div>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Team</th>
                        <th>Game Date</th>
                        <th>Matchup</th>
                        <th>Status</th>
                        <th>Raw Reason</th>
                        <th>Reason Category</th>
                        <th>Body Part</th>
                        <th>Injury Type</th>
                        <th>Source</th>
                    </tr>
                </thead>
                <tbody id="injuries-body"></tbody>
            </table>
        </div>
        <div class="pagination">
            <button type="button" id="prev-page" disabled>Previous</button>
            <span id="page-info">Page 1</span>
            <button type="button" id="next-page">Next</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let allPlayers = [];
        let selectedPlayerId = '';
        let activeResultIndex = -1;

        function loadDropdown(selectId, url, valueKey, labelKey) {
            return fetch(url)
                .then(res => res.json())
                .then(items => {
                    const select = document.getElementById(selectId);
                    items.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item[valueKey];
                        option.textContent = item[labelKey];
                        select.appendChild(option);
                    });
                });
        }

        function loadPlayers() {
            return fetch('/players')
                .then(res => res.json())
                .then(players => {
                    allPlayers = players;
                });
        }

        Promise.all([
            loadPlayers(),
            loadDropdown('team-select', '/teams', 'id', 'canonical_name')
        ]).then(() => loadInjuries(getFilterParams()));

        function loadInjuries(filterQs) {
            const qs = filterQs ? filterQs + '&' : '';
            const url = '/injuries?' + qs + 'page=' + currentPage;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('injuries-body');
                    tbody.innerHTML = '';
                    const tableWrap = document.querySelector('.table-wrap');
                    let emptyState = document.querySelector('.empty-state');
                    if (data.length === 0) {
                        tableWrap.style.display = 'none';
                        if (!emptyState) {
                            emptyState = document.createElement('div');
                            emptyState.className = 'empty-state';
                            emptyState.textContent = 'No matching injury records';
                            tableWrap.parentNode.insertBefore(emptyState, tableWrap.nextSibling);
                        }
                        emptyState.style.display = '';
                    } else {
                        if (emptyState) emptyState.style.display = 'none';
                        tableWrap.style.display = '';
                    }
                    data.forEach(entry => {
                        const tr = document.createElement('tr');
                        const colClasses = ['col-player', 'col-team', '', 'col-matchup', 'col-status', 'col-raw-reason', '', 'col-bodypart', ''];
                        const values = [
                            entry.player_name, entry.team_name, entry.game_date,
                            entry.matchup, entry.status, entry.raw_reason,
                            entry.reason_category, entry.body_part, entry.injury_type
                        ];
                        values.forEach((val, idx) => {
                            const td = document.createElement('td');
                            if (colClasses[idx]) td.className = colClasses[idx];
                            const text = val ?? '';
                            td.textContent = text;
                            td.title = text;
                            if (idx === 4 && val) {
                                td.textContent = '';
                                const badge = document.createElement('span');
                                const slug = val.toLowerCase().replace(/[^a-z]/g, '');
                                badge.className = 'status-badge status-' + slug;
                                badge.textContent = val;
                                td.appendChild(badge);
                            }
                            tr.appendChild(td);
                        });
                        const srcTd = document.createElement('td');
                        if (entry.source_url) {
                            const a = document.createElement('a');
                            a.href = entry.source_url;
                            a.textContent = 'PDF';
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            srcTd.appendChild(a);
                        }
                        tr.appendChild(srcTd);
                        tbody.appendChild(tr);
                    });
                    updatePagination(data.length);
                });
        }

        function updatePagination(count) {
            document.getElementById('page-info').textContent = 'Page ' + currentPage;
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = count < 100;
        }

        function getFilterParams() {
            const fd = new FormData(document.getElementById('filter-form'));
            const params = [];
            for (const [k, v] of fd.entries()) {
                if (!v) continue;
                if (k === 'status' || k === 'season' || k === 'season_type') {
                    params.push(k + '=' + encodeURIComponent(v));
                } else {
                    params.push(k + '=' + encodeURIComponent(v));
                }
            }
            return params.join('&');
        }

        document.getElementById('filter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            currentPage = 1;
            loadInjuries(getFilterParams());
        });

        document.getElementById('prev-page').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                loadInjuries(getFilterParams());
            }
        });

        document.getElementById('next-page').addEventListener('click', function() {
            currentPage++;
            loadInjuries(getFilterParams());
        });

        document.getElementById('download-csv').addEventListener('click', function() {
            const qs = getFilterParams();
            window.location.href = '/injuries.csv' + (qs ? '?' + qs : '');
        });

        document.getElementById('clear-filters').addEventListener('click', function() {
            document.getElementById('player-input').value = '';
            document.getElementById('player_id').value = '';
            selectedPlayerId = '';
            document.getElementById('player-results').classList.remove('open');
            document.getElementById('player-results').innerHTML = '';
            document.getElementById('team-select').value = '';
            document.querySelector('#filter-form input[name="body_part"]').value = '';
            document.querySelector('#filter-form input[name="start_date"]').value = '';
            document.querySelector('#filter-form input[name="end_date"]').value = '';
            document.querySelector('#filter-form input[name="injury_type"]').value = '';
            document.querySelector('#filter-form input[name="reason_search"]').value = '';
            // Restore status defaults
            const statusDefaults = ['Out', 'Doubtful', 'Questionable', 'Probable', 'Available'];
            document.querySelectorAll('#status-panel input[type="checkbox"]').forEach(function(cb) {
                cb.checked = statusDefaults.includes(cb.value);
            });
            updateStatusSummary();
            // Restore season defaults: 2019-20 through 2025-26 checked, 2018-19 unchecked
            const seasonDefaults = ['2019-20', '2020-21', '2021-22', '2022-23', '2023-24', '2024-25', '2025-26'];
            document.querySelectorAll('#season-panel input[type="checkbox"]').forEach(function(cb) {
                cb.checked = seasonDefaults.includes(cb.value);
            });
            updateSeasonSummary();
            // Restore season type defaults: Regular Season, Play-In, Playoffs checked; Preseason unchecked
            const seasonTypeDefaults = ['Regular Season', 'Play-In', 'Playoffs'];
            document.querySelectorAll('#season-type-panel input[type="checkbox"]').forEach(function(cb) {
                cb.checked = seasonTypeDefaults.includes(cb.value);
            });
            updateSeasonTypeSummary();
            currentPage = 1;
            loadInjuries(getFilterParams());
        });

        // ---- Status multiselect ----
        function updateStatusSummary() {
            const panel = document.getElementById('status-panel');
            const trigger = document.getElementById('status-trigger');
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');
            const checked = panel.querySelectorAll('input[type="checkbox"]:checked');
            const total = checkboxes.length;
            if (checked.length === total) {
                trigger.textContent = 'All statuses';
            } else if (checked.length === 0) {
                trigger.textContent = 'None selected';
            } else if (checked.length <= 2) {
                const names = Array.from(checked).map(cb => cb.value);
                trigger.textContent = names.join(', ');
            } else {
                trigger.textContent = checked.length + ' statuses selected';
            }
        }

        (function() {
            const trigger = document.getElementById('status-trigger');
            const panel = document.getElementById('status-panel');
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');

            trigger.addEventListener('click', function() {
                const open = panel.classList.toggle('open');
                trigger.setAttribute('aria-expanded', open);
                if (open) {
                    const first = panel.querySelector('input[type="checkbox"]');
                    if (first) first.focus();
                }
            });

            checkboxes.forEach(function(cb) {
                cb.addEventListener('change', updateStatusSummary);
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('status-multiselect').contains(e.target)) {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                }
            });

            trigger.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                } else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!panel.classList.contains('open')) {
                        panel.classList.add('open');
                        trigger.setAttribute('aria-expanded', 'true');
                        var first = panel.querySelector('input[type="checkbox"]');
                        if (first) first.focus();
                    }
                }
            });

            panel.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                    trigger.focus();
                }
            });

            updateStatusSummary();
        })();

        // ---- Season multiselect ----
        function updateSeasonSummary() {
            const panel = document.getElementById('season-panel');
            const trigger = document.getElementById('season-trigger');
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');
            const checked = panel.querySelectorAll('input[type="checkbox"]:checked');
            const total = checkboxes.length;
            if (checked.length === total) {
                trigger.textContent = 'All seasons';
            } else if (checked.length === 0) {
                trigger.textContent = 'None selected';
            } else if (checked.length === 1) {
                trigger.textContent = checked[0].value;
            } else {
                trigger.textContent = checked.length + ' seasons';
            }
        }

        (function() {
            const trigger = document.getElementById('season-trigger');
            const panel = document.getElementById('season-panel');
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');

            trigger.addEventListener('click', function() {
                const open = panel.classList.toggle('open');
                trigger.setAttribute('aria-expanded', open);
                if (open) {
                    const first = panel.querySelector('input[type="checkbox"]');
                    if (first) first.focus();
                }
            });

            checkboxes.forEach(function(cb) {
                cb.addEventListener('change', updateSeasonSummary);
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('season-multiselect').contains(e.target)) {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                }
            });

            trigger.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                } else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!panel.classList.contains('open')) {
                        panel.classList.add('open');
                        trigger.setAttribute('aria-expanded', 'true');
                        var first = panel.querySelector('input[type="checkbox"]');
                        if (first) first.focus();
                    }
                }
            });

            panel.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                    trigger.focus();
                }
            });

            updateSeasonSummary();
        })();

        // ---- Season Type multiselect ----
        function updateSeasonTypeSummary() {
            const panel = document.getElementById('season-type-panel');
            const trigger = document.getElementById('season-type-trigger');
            const checked = panel.querySelectorAll('input[type="checkbox"]:checked');
            if (checked.length === 0) {
                trigger.textContent = '0 types';
            } else if (checked.length === 1) {
                trigger.textContent = checked[0].value;
            } else {
                trigger.textContent = checked.length + ' types';
            }
        }

        (function() {
            const trigger = document.getElementById('season-type-trigger');
            const panel = document.getElementById('season-type-panel');
            const checkboxes = panel.querySelectorAll('input[type="checkbox"]');

            trigger.addEventListener('click', function() {
                const open = panel.classList.toggle('open');
                trigger.setAttribute('aria-expanded', open);
                if (open) {
                    const first = panel.querySelector('input[type="checkbox"]');
                    if (first) first.focus();
                }
            });

            checkboxes.forEach(function(cb) {
                cb.addEventListener('change', updateSeasonTypeSummary);
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('season-type-multiselect').contains(e.target)) {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                }
            });

            trigger.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                } else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!panel.classList.contains('open')) {
                        panel.classList.add('open');
                        trigger.setAttribute('aria-expanded', 'true');
                        var first = panel.querySelector('input[type="checkbox"]');
                        if (first) first.focus();
                    }
                }
            });

            panel.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    panel.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                    trigger.focus();
                }
            });

            updateSeasonTypeSummary();
        })();

        // ---- Player autocomplete ----
        (function() {
            const input = document.getElementById('player-input');
            const hidden = document.getElementById('player_id');
            const resultsContainer = document.getElementById('player-results');
            let activeIndex = -1;

            function closeResults() {
                resultsContainer.classList.remove('open');
                resultsContainer.innerHTML = '';
                activeIndex = -1;
            }

            function renderResults(query) {
                const q = query.trim().toLowerCase();
                if (!q) {
                    closeResults();
                    return;
                }
                const matches = allPlayers.filter(p =>
                    (p.canonical_name || '').toLowerCase().includes(q)
                ).slice(0, 8);

                if (matches.length === 0) {
                    closeResults();
                    return;
                }

                activeIndex = -1;
                resultsContainer.innerHTML = '';
                matches.forEach((player, i) => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-result';
                    div.textContent = player.canonical_name;
                    div.dataset.playerId = player.id;
                    div.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        selectPlayer(player);
                    });
                    resultsContainer.appendChild(div);
                });
                resultsContainer.classList.add('open');
            }

            function selectPlayer(player) {
                input.value = player.canonical_name;
                hidden.value = player.id;
                selectedPlayerId = player.id;
                closeResults();
            }

            function navigateResults(direction) {
                const items = resultsContainer.querySelectorAll('.autocomplete-result');
                if (items.length === 0) return;
                items.forEach(el => el.classList.remove('active'));
                activeIndex += direction;
                if (activeIndex < 0) activeIndex = items.length - 1;
                if (activeIndex >= items.length) activeIndex = 0;
                items[activeIndex].classList.add('active');
                items[activeIndex].scrollIntoView({ block: 'nearest' });
            }

            function selectActiveResult() {
                const items = resultsContainer.querySelectorAll('.autocomplete-result');
                if (activeIndex >= 0 && activeIndex < items.length) {
                    const playerId = items[activeIndex].dataset.playerId;
                    const player = allPlayers.find(p => String(p.id) === String(playerId));
                    if (player) selectPlayer(player);
                }
            }

            input.addEventListener('input', function() {
                hidden.value = '';
                selectedPlayerId = '';
                renderResults(input.value);
            });

            input.addEventListener('keydown', function(e) {
                if (!resultsContainer.classList.contains('open')) {
                    if (e.key === 'ArrowDown' && input.value.trim()) {
                        renderResults(input.value);
                    }
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateResults(1);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateResults(-1);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    selectActiveResult();
                } else if (e.key === 'Escape') {
                    closeResults();
                }
            });

            input.addEventListener('blur', function() {
                setTimeout(closeResults, 150);
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('player-autocomplete').contains(e.target)) {
                    closeResults();
                }
            });
        })();
    </script>
</body>
</html>
