name: Update public injury data (daily)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "First report date to recover (YYYY-MM-DD; default yesterday UTC)"
        required: false
        type: string
      end_date:
        description: "Last report date to recover (YYYY-MM-DD; default start date)"
        required: false
        type: string
      repair_database_ids:
        description: "Repair missing automatic IDs before updating (preserves rows)"
        required: false
        type: boolean
        default: false

concurrency:
  group: updater-public-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: Repair production ID generators
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_database_ids }}
        run: python -m scripts.repair_production_ids

      - name: Calculate yesterday's date (UTC)
        id: date
        run: |
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "date=$YESTERDAY" >> "$GITHUB_OUTPUT"

      - name: Run updater
        env:
          START_DATE: ${{ inputs.start_date || steps.date.outputs.date }}
          END_DATE: ${{ inputs.end_date || inputs.start_date || steps.date.outputs.date }}
        run: |
          python -m app.jobs.update_public_daily \
            --start-date "$START_DATE" \
            --end-date "$END_DATE"
